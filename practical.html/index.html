<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2ff;
        }

        .container {
            width: 420px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Circular open box */
        .profile-box {
            width: 120px;
            height: 120px;
            border: 2px dashed #555;
            border-radius: 50%;
            margin: 0 auto 15px;
            text-align: center;
            line-height: 120px;
            color: #777;
            cursor: pointer;
            overflow: hidden;
        }

        .profile-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        input, select {
            width: 100%;
            padding: 7px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .subjects {
            margin-top: 5px;
        }

        .subjects input {
            margin-right: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #4a63f3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #354bd6;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Registration</h2>

    <!-- Profile Photo -->
    <div class="profile-box" onclick="document.getElementById('photo').click()">
        <span id="photoText">Upload Photo</span>
        <img id="preview">
    </div>
    <input type="file" id="photo" accept="image/*" hidden>

    <form onsubmit="return validateForm()">

        <label>Name</label>
        <input type="text" id="name">

        <label>Email</label>
        <input type="email" id="email">

        <label>Age</label>
        <input type="number" id="age">

        <label>Course</label>
        <select id="course">
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>MBA</option>
        </select>

        <label>Subjects</label>
        <div class="subjects">
            <input type="checkbox" value="Maths"> Maths <br>
            <input type="checkbox" value="CS"> Computer Science <br>
            <input type="checkbox" value="Physics"> Physics <br>
            <input type="checkbox" value="English"> English
        </div>

        <label>Fee</label>
        <input type="number" id="fee">

        <label>University Roll Number</label>
        <input type="text" id="roll">

        <div class="error" id="errorMsg"></div>

        <button type="submit">Register</button>
    </form>
</div>

<script>
    // Image Preview
    document.getElementById("photo").addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function () {
                document.getElementById("preview").src = reader.result;
                document.getElementById("photoText").style.display = "none";
            }
            reader.readAsDataURL(file);
        }
    });

    // Form Validation
    function validateForm() {
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let age = document.getElementById("age").value;
        let course = document.getElementById("course").value;
        let fee = document.getElementById("fee").value;
        let roll = document.getElementById("roll").value;

        let error = document.getElementById("errorMsg");

        if (name === "" || email === "" || age === "" || course === "" || fee === "" || roll === "") {
            error.innerText = "All fields are required!";
            return false;
        }

        if (age < 16 || age > 60) {
            error.innerText = "Age must be between 16 and 60!";
            return false;
        }

        alert("Registration Successful!");
        return true;
    }
    let name = document.getElementById("name").value;
let age = document.getElementById("age").value;
let email = document.getElementById("email").value;
if(name === "" || age === "" || email === "")
    alert("All fields are required");
else if(age < 18)
    alert("Age must be 18 or above");
else
    alert("Registration Successful");
console.log("Student Name:", name);

</script>

</body>
</html>
